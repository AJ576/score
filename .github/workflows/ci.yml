name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Show toolchain
        run: |
          uname -a
          cmake --version
          python --version
          pip --version
          cc --version || true
          c++ --version || true

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 numpy pytest scikit-build-core

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (CMake)
        run: cmake --build build --parallel

      - name: Run C++ tests (ctest)
        # The math is stubbed and most tests carry [!shouldfail],
        # so ctest should pass green against the scaffold.
        run: ctest --test-dir build --output-on-failure

      - name: Install Python package (editable)
        run: pip install -e ".[dev]"

      - name: Verify Python import
        run: |
          python -c "import score; print('score', score.__version__)"
          python -c "from score import Series, DescriptiveStats, StockAnalyzer; \
            s = Series([1.0, 2.0, 3.0]); \
            print('Series len =', len(s)); \
            DescriptiveStats(s); \
            StockAnalyzer(s); \
            print('bindings ok')"

      - name: Verify mock JSON is loadable
        run: |
          python -c "from score.data import load_mock_data, get_prices; \
            d = load_mock_data(); \
            print('tickers:', d.tickers); \
            print('first close:', list(get_prices(d, 'AAPL'))[0])"

      - name: Run Python tests (pytest)
        run: python -m pytest tests/python -v

      - name: Regenerate mock data (idempotency check)
        run: |
          python scripts/gen_mock_data.py
          # File should still parse and contain expected ticker count.
          python -c "import json; d = json.load(open('data/mock_stocks.json')); \
            assert len(d['data']) == 5, 'expected 5 tickers'; \
            print('regenerated ok')"

  lint-formatting:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C/C++ formatting
        run: |
          # `--dry-run --Werror` makes clang-format exit non-zero on diffs.
          find include src tests/cpp -type f \
              \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
              -print0 | xargs -0 clang-format --dry-run --Werror
